[package]
name = "magickey_core"
version = "0.1.0"
edition = "2021"
authors = ["Magic Key Lead Architect <architect@magickey.local>"]
description = "Core format detection, format registry, and virtualized hex engine for Magic Key"
license = "Apache-2.0"

[lib]
name = "magickey_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "magickey_cli"
path = "src/bin/magickey_cli.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
