name: Build & Verify Magic Key ARM64 APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Magic Key ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Core Unit & Integration Tests
        working-directory: core
        run: cargo test --verbose

      - name: Build Host Rust Library for Dart FFI Testing
        working-directory: core
        run: |
          cargo build --release
          cp ../target/release/libmagickey_core.so ../app/libmagickey_core.so

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Flutter Diagnostics & Pub Get
        working-directory: app
        run: |
          flutter doctor -v
          flutter pub get

      - name: Run Flutter & Live Dart:FFI Runtime Tests
        working-directory: app
        run: flutter test --verbose

      - name: Verify Committed Android Project & JNI Packaging
        run: |
          echo "Verifying committed Android project structure (source of truth)..."
          ls -la app/android/
          ls -la app/android/app/
          ls -la app/android/gradle/wrapper/
          echo "Verifying ARM64 native library in jniLibs:"
          ls -lh app/android/app/src/main/jniLibs/arm64-v8a/libmagickey_core.so
          file app/android/app/src/main/jniLibs/arm64-v8a/libmagickey_core.so
          chmod +x app/android/gradlew

      - name: Build Release ARM64 Android APK from Committed Project
        working-directory: app
        run: |
          # Builds directly from the committed app/android without deleting or recreating anything
          flutter build apk --release --target-platform android-arm64

      - name: Verify APK Structure, Native Lib & SHA-256
        run: |
          APK_PATH="app/build/app/outputs/flutter-apk/app-release.apk"
          echo "Found APK at: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "=========================================================="
          echo "SHA-256 Checksum:"
          sha256sum "$APK_PATH"
          echo "=========================================================="
          echo "Listing APK contents for ARM64 native library:"
          unzip -l "$APK_PATH" | grep -E "libmagickey_core.so|classes.dex"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: magickey-arm64-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
