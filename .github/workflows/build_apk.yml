name: Build & Verify Magic Key ARM64 APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Magic Key ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Core Tests
        working-directory: core
        run: cargo test --verbose

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Flutter Diagnostics & Pub Get
        working-directory: app
        run: |
          flutter doctor -v
          flutter pub get

      - name: Run Flutter Unit Tests
        working-directory: app
        run: flutter test --verbose

      - name: Verify Native ARM64 jniLibs Packaging
        run: |
          ls -la app/android/app/src/main/jniLibs/arm64-v8a/libmagickey_core.so
          file app/android/app/src/main/jniLibs/arm64-v8a/libmagickey_core.so

      - name: Ensure Android Build Scaffolding & Gradle Wrapper
        working-directory: app
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Generating Gradle wrapper via flutter create..."
            mkdir -p /tmp/magickey_backup
            cp -r android/app/src/main/AndroidManifest.xml /tmp/magickey_backup/
            cp -r android/app/src/main/kotlin/com/magickey/app/MainActivity.kt /tmp/magickey_backup/
            cp -r android/app/src/main/jniLibs /tmp/magickey_backup/
            cp android/app/build.gradle /tmp/magickey_backup/
            cp android/settings.gradle /tmp/magickey_backup/
            cp android/build.gradle /tmp/magickey_backup/
            
            flutter create --platforms=android --org com.magickey .
            
            # Restore project-specific configurations
            cp /tmp/magickey_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            cp /tmp/magickey_backup/MainActivity.kt android/app/src/main/kotlin/com/magickey/app/MainActivity.kt
            mkdir -p android/app/src/main/jniLibs/arm64-v8a
            cp -r /tmp/magickey_backup/jniLibs/* android/app/src/main/jniLibs/
            cp /tmp/magickey_backup/build.gradle android/app/build.gradle
            cp /tmp/magickey_backup/settings.gradle android/settings.gradle
            cp /tmp/magickey_backup/build.gradle android/build.gradle 2>/dev/null || true
          fi
          chmod +x android/gradlew || true

      - name: Build Release ARM64 Android APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Verify APK Structure & Native Lib
        run: |
          APK_PATH="app/build/app/outputs/flutter-apk/app-release.apk"
          echo "Found APK at: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "Listing APK contents for ARM64 native library:"
          unzip -l "$APK_PATH" | grep -E "libmagickey_core.so|classes.dex"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: magickey-arm64-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
